AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NewsRAG - An automated ETL pipeline orchestrated by AWS Step Functions
  that scrapes, classifies, embeds, and deduplicates news articles.

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024 
    Runtime: python3.12
    Environment:
      Variables:
        MONGODB_URI: !Ref MongoDBConnectionString
        MONGODB_DATABASE: news_rag
        MONGODB_COLLECTION: articles
        LLM_MODEL_ID: !Ref LLMModelId

Parameters:
  LLMModelId:
    Type: String
    Default: zai.glm-5
    Description: >
      On-demand Bedrock model ID for classification and chatbot answers (called via the Converse API).
      Alternatives tested on the Free plan: qwen.qwen3-235b-a22b-2507-v1:0, nvidia.nemotron-super-3-120b.
  MongoDBConnectionString:
    Type: String
    Description: MongoDB Atlas connection string with read/write access to the news_rag database.
    NoEcho: true

Resources:
  # =====================================================================================
  # == Lambda Functions for the State Machine
  # =====================================================================================

  # 1. Scraper Function: Extracts, transforms, and loads news articles.
  NewsScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NewsRAG-Scraper
      CodeUri: lambda_package/
      Handler: lambda_function.lambda_handler
      Description: Scrapes, classifies, and embeds news articles, then saves them to MongoDB.
      Role: !GetAtt NewsRAGLambdaRole.Arn

  # 2. Embedding Function: Generates embeddings for articles that don't have them.
  EmbeddingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NewsRAG-Embedding
      CodeUri: lambda_package/
      Handler: embedding_lambda.lambda_handler
      Description: Generates and saves vector embeddings for news articles.
      Role: !GetAtt NewsRAGLambdaRole.Arn

  # 3. Index Manager Function: Checks for and creates the MongoDB vector index.
  IndexManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NewsRAG-IndexManager
      CodeUri: lambda_package/
      Handler: index_manager_lambda.lambda_handler
      Description: Checks if the MongoDB vector search index exists and creates it if needed.
      Role: !GetAtt NewsRAGLambdaRole.Arn

  # 4. Deduplicator Function: Removes duplicate articles using vector search.
  DeduplicatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NewsRAG-Deduplicator
      CodeUri: lambda_package/
      Handler: deduplicator_lambda.lambda_handler
      Description: Finds and consolidates duplicate articles in MongoDB using vector similarity.
      Role: !GetAtt NewsRAGLambdaRole.Arn

  # 5. Chatbot Function: Handles AI-powered Q&A using vector search and Claude.
  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NewsRAG-Chatbot
      CodeUri: lambda_package/
      Handler: chatbot_lambda.lambda_handler
      Description: Processes user queries, performs vector search on MongoDB, and generates AI responses using Bedrock.
      # Public HTTPS URL that the Streamlit dashboard calls (AWS_API_URL)
      FunctionUrlConfig:
        AuthType: NONE
      Role: !GetAtt NewsRAGLambdaRole.Arn

  # Public function URLs also need lambda:InvokeFunction (scoped to calls made through the URL).
  # SAM adds lambda:InvokeFunctionUrl itself.
  ChatbotUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatbotFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # =====================================================================================
  # == Step Functions State Machine for Orchestration
  # =====================================================================================

  NewsETLStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: NewsRAG-ETL-Workflow
      Type: STANDARD
      DefinitionUri: statemachine/workflow.asl.json
      DefinitionSubstitutions:
        NewsScraperFunction: !Ref NewsScraperFunction
        EmbeddingFunction: !Ref EmbeddingFunction
        IndexManagerFunction: !Ref IndexManagerFunction
        DeduplicatorFunction: !Ref DeduplicatorFunction
      Role: !GetAtt NewsETLStateMachineRole.Arn
      Events:
        ScheduledTrigger:
          Type: Schedule
          Properties:
            Name: Every-12-Hours-Trigger
            Description: Triggers the NewsRAG ETL workflow every 12 hours.
            Schedule: rate(2 hours)
            Enabled: true

  NewsETLStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt NewsScraperFunction.Arn
                  - !GetAtt EmbeddingFunction.Arn
                  - !GetAtt IndexManagerFunction.Arn
                  - !GetAtt DeduplicatorFunction.Arn


  # =====================================================================================
  # == Shared execution role for all 5 Lambdas
  # =====================================================================================
  # Fixed name => stable ARN (arn:aws:iam::<account>:role/NewsRAG-LambdaRole), e.g. for a
  # MongoDB Atlas "AWS IAM" database user. Holds the combined permissions of all Lambdas.
  NewsRAGLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NewsRAG-LambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole   # CloudWatch Logs
      Policies:
        - PolicyName: NewsRAGBedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
                  # Chat/classification model (on-demand, called in this region)
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${LLMModelId}'
        - PolicyName: NewsRAGSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:newsrag/api-keys-*'

Outputs:
  StateMachineArn:
    Description: "ARN of the Step Functions State Machine"
    Value: !Ref NewsETLStateMachine
  NewsScraperFunction:
    Description: "Name of the Scraper Lambda function"
    Value: !Ref NewsScraperFunction
  EmbeddingFunction:
    Description: "Name of the Embedding Lambda function"
    Value: !Ref EmbeddingFunction
  IndexManagerFunction:
    Description: "Name of the Index Manager Lambda function"
    Value: !Ref IndexManagerFunction
  DeduplicatorFunction:
    Description: "Name of the Deduplicator Lambda function"
    Value: !Ref DeduplicatorFunction
  ChatbotFunction:
    Description: "Name of the Chatbot Lambda function"
    Value: !Ref ChatbotFunction
  ChatbotUrl:
    Description: "Public URL of the chatbot - set this as AWS_API_URL in Streamlit secrets"
    Value: !GetAtt ChatbotFunctionUrl.FunctionUrl
  LambdaRoleArn:
    Description: "Shared execution role of all 5 Lambdas (use for a MongoDB Atlas AWS IAM user)"
    Value: !GetAtt NewsRAGLambdaRole.Arn
